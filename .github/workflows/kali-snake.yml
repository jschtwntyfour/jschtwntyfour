name: Generate Kali Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/kali-snake-dark.svg?color_snake=#557C94&color_dots=#161b22,#1b3a57,#2a5f8f,#3f8bc4,#6cb6ff
            dist/kali-snake.svg?color_snake=#557C94&color_dots=#ebedf0,#c6dcf2,#8fbbe6,#4f8fd1,#1f5fa8

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: kali-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
