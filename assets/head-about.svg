<svg xmlns="http://www.w3.org/2000/svg" width="900" height="56" viewBox="0 0 900 56" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<clipPath id="cp"><rect x="1" y="1" width="898" height="54" rx="12"/></clipPath>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0" spreadMethod="repeat">
<stop offset="0" stop-color="#9aa4af"/><stop offset=".35" stop-color="#9aa4af"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".65" stop-color="#9aa4af"/><stop offset="1" stop-color="#9aa4af"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3.5s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="sc"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
</defs>
<style>
.t{font:700 24px 'Fira Code',Consolas,'Courier New',monospace}
.ch{fill:none;stroke:#ffffff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;animation:fl 1.4s ease-in-out infinite}
@keyframes fl{0%,100%{opacity:.15}50%{opacity:1}}
.sc{animation:mv 3.5s linear infinite}
@keyframes mv{from{transform:translateX(-160px)}to{transform:translateX(900px)}}
.cu{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@keyframes gl{0%,100%{stroke-opacity:.3}50%{stroke-opacity:.9}}
.bd{animation:gl 3s ease-in-out infinite}
</style>
<rect x="1" y="1" width="898" height="54" rx="12" fill="#0d1117"/>
<g clip-path="url(#cp)"><rect class="sc" x="0" y="51" width="160" height="4" fill="url(#sc)"/></g>
<rect class="bd" x="1" y="1" width="898" height="54" rx="12" fill="none" stroke="#ffffff" stroke-width="1.5"/>
<polyline class="ch" style="animation-delay:0.0s" points="40,19 48,28 40,37" /><polyline class="ch" style="animation-delay:0.0s" points="860,19 852,28 860,37" /><polyline class="ch" style="animation-delay:0.25s" points="56,19 64,28 56,37" /><polyline class="ch" style="animation-delay:0.25s" points="844,19 836,28 844,37" /><polyline class="ch" style="animation-delay:0.5s" points="72,19 80,28 72,37" /><polyline class="ch" style="animation-delay:0.5s" points="828,19 820,28 828,37" />
<text x="450" y="37" text-anchor="middle" textLength="132" lengthAdjust="spacing" class="t" fill="url(#sh)">ABOUT ME</text>
<rect class="cu" x="526" y="17" width="10" height="22" fill="#ffffff"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>